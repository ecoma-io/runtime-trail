[workspace]
resolver = "3"
members = [
    "crates/telemetry-model",
    "crates/telemetry-ingestion",
    "crates/correlation",
    "crates/query",
    "crates/investigation",
    "crates/storage",
    "crates/storage-memory",
    "crates/storage-sqlite",
    "crates/mcp",
    "crates/server",
    "crates/bench-probes",
    "apps/desktop/src-tauri",
]

# The org's Rust lint bar, inherited by every crate via `[lints] workspace =
# true`. A crate that genuinely needs `unsafe` must write its own `[lints]`
# table — a visible diff decision, never a silent one.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.package]
version = "0.0.0"
edition = "2024"
# Edition 2024 stabilised in Rust 1.85 — that fact is the floor, not a number
# someone remembered. Contributors and CI run `stable`; this is the
# compatibility contract. See docs/decisions/0001-runtime-language.md.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ecoma-io/runtime-trail"

[workspace.dependencies]
runtime-trail-telemetry-model = { path = "crates/telemetry-model" }
runtime-trail-correlation = { path = "crates/correlation" }
runtime-trail-query = { path = "crates/query" }
runtime-trail-investigation = { path = "crates/investigation" }
runtime-trail-storage = { path = "crates/storage" }
runtime-trail-storage-memory = { path = "crates/storage-memory" }
runtime-trail-storage-sqlite = { path = "crates/storage-sqlite" }
runtime-trail-telemetry-ingestion = { path = "crates/telemetry-ingestion" }
runtime-trail-mcp = { path = "crates/mcp" }
runtime-trail-server = { path = "crates/server" }

serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Phase 3 (persistence). `rusqlite` (with the bundled SQLite engine) is the
# embedded storage engine the file-backed mode runs on (ADR 0003): the
# engine compiles in, so the workspace never depends on an ambient SQLite
# installation (ADR 0001's ambient-toolchain rule). `tempfile` is
# test-scratch only — driver parity and durability tests write a real
# database file, in a directory they own.
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

# Phase 1 (OTLP ingestion). `prost` is the protobuf runtime the OTLP wire
# payloads are decoded with — OTLP is the only ingestion contract
# (docs/product/non-goals.md), so a protobuf runtime is load-bearing, not
# optional. `tonic` serves the OTLP/gRPC endpoint and is confined to
# `crates/server` (layer-app) by ADR 0001: no crate outside layer-app takes a
# transport dependency. `bytes` is the payload buffer type both edges pass
# without copying.
#
# OTLP message types: sourced as committed `prost-build` codegen inside
# `crates/telemetry-ingestion` (decision of the ingestion unit). The
# pre-generated `opentelemetry-proto` crate was rejected: it couples its
# versioning to the OpenTelemetry SDK release train, compiles transport
# siblings (`gen-tonic`) this core must never see (ADR 0001), and pins its
# own prost major — a second protobuf runtime. Build-time codegen
# (`build.rs` + prost-build) was rejected because it needs `protoc` on every
# machine, against the ambient-toolchain rule (ADR 0001). Committed output
# keeps this build graph at exactly `prost`; the vendored, hash-pinned
# upstream `.proto` sources and the committed regeneration script keep the
# artifacts reproducible (see `crates/telemetry-ingestion/protos/
# PROVENANCE.md` and `crates/telemetry-ingestion/regenerate.sh`).
prost = "0.14"
# Pinned exactly: 0.14.5 declares `rust-version = 1.75`, which fits the
# workspace's 1.85 floor (ADR 0001's ambient-toolchain rule), while 0.14.6
# declares 1.88 — above the floor — so a caret range would silently raise
# the toolchain contract the workspace commits to. Only the server side is
# built: no client transport stack, no TLS. `codegen` (one extra
# dependency, async-trait) is what the hand-written service glue compiles
# against. The dependency is confined to `crates/server` (layer-app) by
# ADR 0001.
tonic = { version = "=0.14.5", default-features = false, features = [
  "server",
  "codegen",
] }
bytes = "1"
