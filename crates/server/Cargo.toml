[package]
name = "runtime-trail-server"
description = "The composition root: starts the core, serves the Investigation API, the UI and health surfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
runtime-trail-investigation = { workspace = true }
runtime-trail-storage = { workspace = true }
runtime-trail-storage-memory = { workspace = true }
runtime-trail-telemetry-ingestion = { workspace = true }
runtime-trail-telemetry-model = { workspace = true }
axum = { workspace = true, features = ["http2"] } # gRPC-over-HTTP2 needs the server's HTTP/2 support (not in axum's default features)
# The gRPC passthrough codec hands the OTLP frame's payload to the pipeline
# as borrowed transport bytes (zero-copy); `bytes::Bytes` is the type the
# whole admission path (queue, store) accounts with.
bytes = { workspace = true }
# The HTTP body reader's two failure modes must come apart honestly: the
# payload that grew past the ceiling is a 413 over-cap refusal, a body that
# never arrived in full is not — `LengthLimitError` is what names the
# difference, so the handler can answer each with its own reason.
http-body-util = "0.1"
prost = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The Investigation endpoint's JSON surface: the request subject is
# parsed and the whole envelope rendered with serde_json in the served
# crate itself (not a dev-only concern).
serde_json = { workspace = true }

[dev-dependencies]
# One real-socket test drives the gRPC surface with tonic's own client
# stack (Endpoint/Channel over TCP, `Grpc::unary`/`streaming` and a
# hand-written client codec): the wire proof the in-process tower calls
# cannot give. Dev-only — the served crate itself never builds a client;
# the `channel` feature exists for this test alone.
tonic = { workspace = true, features = ["channel"] }
tower = { version = "0.5", features = ["util"] }
# The same semantic fixtures this crate's own tests admit with — the wire
# bytes the server's tests POST are encoded from them, so the server's tests
# exercise the exact OTLP shapes the ingestion crate means, not mirrored
# structs. Dev-only: the served crate itself never builds fixtures.
runtime-trail-telemetry-ingestion = { workspace = true, features = ["fixtures"] }
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = { version = "0.32.0", features = ["http-proto", "trace", "logs", "metrics"] }

[lints]
workspace = true
