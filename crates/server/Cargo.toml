[package]
name = "runtime-trail-server"
description = "The composition root: starts the core, serves the Investigation API, the UI and health surfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
runtime-trail-investigation = { workspace = true }
runtime-trail-storage = { workspace = true }
runtime-trail-storage-memory = { workspace = true }
runtime-trail-telemetry-ingestion = { workspace = true }
runtime-trail-telemetry-model = { workspace = true }
axum = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tower = { version = "0.5", features = ["util"] }
# The same semantic fixtures this crate's own tests admit with — the wire
# bytes the server's tests POST are encoded from them, so the server's tests
# exercise the exact OTLP shapes the ingestion crate means, not mirrored
# structs. Dev-only: the served crate itself never builds fixtures.
runtime-trail-telemetry-ingestion = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
