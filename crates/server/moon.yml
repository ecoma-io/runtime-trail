# `moon` project for the composition root. Tasks are `cache: false` on
# purpose — see the comment in crates/telemetry-model/moon.yml.
#
# `layer: library` (moon's graph taxonomy) is exact: this crate is a library
# the desktop shell, the Docker image and the CLI binary all consume — nothing
# imports an application, and nothing imports this crate "as an app". Its
# architectural vocabulary is the `layer-app` tag below, which is what the
# boundary table judges.
language: rust
layer: library
stack: backend
tags:
  - layer-app
tasks:
  lint:
    script: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings
    options:
      cache: false
  typecheck:
    command: cargo check --locked --all-targets
    options:
      cache: false
  test:
    command: bash $MOON_WORKING_DIR/scripts/cargo-test.sh
    options:
      cache: false
  build:
    command: cargo build --locked
    options:
      cache: false
