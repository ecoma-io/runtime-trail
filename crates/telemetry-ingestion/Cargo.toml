[package]
name = "runtime-trail-telemetry-ingestion"
description = "OTLP ingestion: receiving OpenTelemetry data with admission control and backpressure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
prost = { workspace = true }
runtime-trail-telemetry-model = { workspace = true }

[features]
# Compiles the semantic OTLP fixtures (`crates/telemetry-ingestion/src/
# fixtures.rs`) into the crate for consumers above admission — the transport
# tests its wire bytes against the same builders this crate's own tests use —
# together with the one test-observable ledger window
# (`LedgerReleaser::resident_streams`) the composition tests use to prove
# the eviction hook's release forwards reach the ledger. Off by default: a
# production consumer of admission never links the fixtures or the window.
fixtures = []

[lints]
workspace = true
